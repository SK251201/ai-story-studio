name: Python application checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python entry points
        run: |
          python -m py_compile app.py
          python -m py_compile blender_pipeline/render_project.py
          python -m py_compile blender_pipeline/render_scene.py
      - name: Check required files
        run: |
          test -f requirements.txt
          test -f README.md
          test -f blender_pipeline/README.md
